apiVersion: apps/v1
kind: Deployment
metadata:
  name: dufflebag
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dufflebag
  template:
    metadata:
      labels:
        app: dufflebag
    spec:
      initContainers:
        - name: migrate
          image: quay.io/benjamin_holmes/dufflebag:<tag>
          args: ["migrate"]
          env:
            - name: DFBG_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: dufflebag
                  key: migrate-database-url
      containers:
        - name: dufflebag
          image: quay.io/benjamin_holmes/dufflebag:<tag>
          env:
            - name: DFBG_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: dufflebag
                  key: app-database-url
            - name: DFBG_HTTP_ADDR
              value: :8080
            - name: DFBG_TOKEN_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: dufflebag
                  key: token-signing-key
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            # A fresh instance answers 501 until first run completes. It is
            # deliberately not ready until /sys/init; see docs/deployment.md.
            httpGet:
              path: /sys/health
              port: http
            periodSeconds: 2
          livenessProbe:
            # This must not use /sys/health: its 501 on an unclaimed instance
            # would restart-loop the pod before anyone could initialize it.
            tcpSocket:
              port: http
            periodSeconds: 10
          # Resources are deployment-specific and intentionally left unset.
