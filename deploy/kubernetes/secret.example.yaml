# EXAMPLE ONLY: copy this file, replace every placeholder, and apply the copy.
# Never apply this example verbatim. See "PostgreSQL: two roles" in
# docs/deployment.md for creating the migration and serving roles.
apiVersion: v1
kind: Secret
metadata:
  name: dufflebag
type: Opaque
stringData:
  migrate-database-url: postgres://dufflebag_migrate:<migration password>@db/dufflebag
  app-database-url: postgres://dufflebag_app:<serving password>@db/dufflebag
  token-signing-key: <at least 32 random bytes>
