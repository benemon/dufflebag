# Source: dufflebag/templates/postgres.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: dufflebag-postgres
  labels:
    app.kubernetes.io/name: dufflebag
    app.kubernetes.io/instance: dufflebag
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: dufflebag-0.2.1
spec:
  serviceName: dufflebag-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: dufflebag
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: dufflebag
        app.kubernetes.io/component: postgres
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-data-directory
          image: "docker.io/library/postgres:17-alpine"
          command: ["/bin/sh", "-ec", "chmod g+rwx /var/lib/postgresql/data || true"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
                - SETGID
                - SETUID
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            {}
      containers:
        - name: postgres
          image: "docker.io/library/postgres:17-alpine"
          command:
            - /bin/sh
            - -ec
            - |
              if [ "$(id -u)" = 0 ]; then
                exec gosu postgres:root docker-entrypoint.sh postgres
              fi
              exec docker-entrypoint.sh postgres
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
                - SETGID
                - SETUID
          env:
            - name: POSTGRES_DB
              value: dufflebag
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dufflebag-postgres
                  key: postgres-password
            - name: POSTGRES_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dufflebag-postgres
                  key: app-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "dufflebag"]
            periodSeconds: 2
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
          resources:
            {}
      volumes:
        - name: initdb
          configMap:
            name: dufflebag-postgres-init
            defaultMode: 0555
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
