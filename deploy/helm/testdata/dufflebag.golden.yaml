# Source: dufflebag/templates/dufflebag.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dufflebag
  labels:
    app.kubernetes.io/name: dufflebag
    app.kubernetes.io/instance: dufflebag
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: dufflebag-0.2.1
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: dufflebag
      app.kubernetes.io/component: dufflebag
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: dufflebag
        app.kubernetes.io/component: dufflebag
    spec:
      serviceAccountName: dufflebag
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-postgres
          image: "docker.io/library/postgres:17-alpine"
          command: ["/bin/sh", "-ec", "until pg_isready -h dufflebag-postgres -U postgres -d dufflebag; do sleep 2; done"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: dufflebag-postgres
                  key: postgres-password
          resources:
            {}
        - name: wait-for-vault-bootstrapped
          image: "docker.io/hashicorp/vault:2.0.3"
          command:
            - /bin/sh
            - -ec
            - |
              export VAULT_ADDR=http://dufflebag-vault:8200
              jwt=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
              until login=$(vault write -format=json auth/kubernetes/login role=dufflebag jwt="$jwt" 2>/dev/null); do sleep 2; done
              token=$(printf '%s' "$login" | sed -n 's/.*"client_token"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')
              [ -n "$token" ]
              VAULT_TOKEN="$token" vault write transit/encrypt/dufflebag plaintext=cmVhZHk= >/dev/null
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            {}
        - name: wait-for-ceph
          image: "quay.io/benjamin_holmes/ceph-aio:v20"
          imagePullPolicy: Always
          command:
            - /bin/sh
            - -ec
            - |
              until python3 -c 'import socket; socket.create_connection(("dufflebag-ceph", 8000), 2).close()'; do sleep 2; done
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            {}
      containers:
        - name: dufflebag
          image: "quay.io/benjamin_holmes/dufflebag:v0.2.0"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: DFBG_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: dufflebag-postgres
                  key: app-database-url
            - name: DFBG_HTTP_ADDR
              value: :8080
            - name: DFBG_SCANNER_ADAPTER
              value: "osv"
            - name: DFBG_KEY_PROVIDER
              value: vault
            - name: DFBG_VAULT_ADDR
              value: http://dufflebag-vault:8200
            - name: DFBG_VAULT_AUTH_METHOD
              value: kubernetes
            - name: DFBG_VAULT_K8S_ROLE
              value: dufflebag
            - name: DFBG_VAULT_K8S_MOUNT
              value: kubernetes
            - name: DFBG_VAULT_K8S_TOKEN_PATH
              value: /var/run/secrets/kubernetes.io/serviceaccount/token
            - name: DFBG_VAULT_TRANSIT_MOUNT
              value: transit
            - name: DFBG_VAULT_TRANSIT_KEY
              value: dufflebag
            - name: DFBG_OBJECT_STORAGE_ENDPOINT
              value: http://dufflebag-ceph:8000
            - name: DFBG_OBJECT_STORAGE_REGION
              value: us-east-1
            - name: DFBG_OBJECT_STORAGE_BUCKET
              value: "dufflebag"
            - name: DFBG_OBJECT_STORAGE_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: dufflebag-ceph
                  key: access-key
            - name: DFBG_OBJECT_STORAGE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: dufflebag-ceph
                  key: secret-key
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            # Readiness means listening, not initialized: /sys/health answers
            # 501 until the instance is claimed, and a Service that never
            # routes to an unclaimed instance would make the first-run wizard
            # unreachable. The console route serves 200 as soon as the
            # listener is up.
            httpGet:
              path: /
              port: http
            periodSeconds: 2
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          resources:
            {}
