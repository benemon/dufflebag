# Source: dufflebag/templates/ceph.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: dufflebag-ceph
  labels:
    app.kubernetes.io/name: dufflebag
    app.kubernetes.io/instance: dufflebag
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: dufflebag-0.2.1
spec:
  serviceName: dufflebag-ceph
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: dufflebag
      app.kubernetes.io/component: ceph
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: dufflebag
        app.kubernetes.io/component: ceph
    spec:
      serviceAccountName: dufflebag-ceph
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # The image bakes its expected /var/lib/ceph tree; an empty PVC mounted
        # over it shadows that structure and the daemons fail on first boot.
        # Seed the volume from the image once, then leave it alone.
        - name: seed-data
          image: "quay.io/benjamin_holmes/ceph-aio:v20"
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
          command:
            - /bin/sh
            - -ec
            - |
              # Not an emptiness check: fresh block volumes carry lost+found,
              # so probe for the baked tree's own structure instead.
              if [ ! -d /seed-target/tmp ]; then
                cp -a /var/lib/ceph/. /seed-target/
              fi
          volumeMounts:
            - name: data
              mountPath: /seed-target
      containers:
        - name: ceph
          image: "quay.io/benjamin_holmes/ceph-aio:v20"
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            - name: s3
              containerPort: 8000
          readinessProbe:
            tcpSocket:
              port: s3
            periodSeconds: 5
            failureThreshold: 60
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -ec
                  - /bootstrap/bootstrap.sh "$CEPH_ACCESS_KEY" "$CEPH_SECRET_KEY" "$CEPH_BUCKET" "dufflebag-ceph"
          env:
            - name: CEPH_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: dufflebag-ceph
                  key: access-key
            - name: CEPH_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: dufflebag-ceph
                  key: secret-key
            - name: CEPH_BUCKET
              value: "dufflebag"
          volumeMounts:
            - name: data
              mountPath: /var/lib/ceph
            - name: bootstrap
              mountPath: /bootstrap
          resources:
            {}
      volumes:
        - name: bootstrap
          configMap:
            name: dufflebag-ceph-bootstrap
            defaultMode: 0555
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
