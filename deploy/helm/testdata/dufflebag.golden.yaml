apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: dufflebag-vault
  labels:
    app.kubernetes.io/name: dufflebag
    app.kubernetes.io/instance: dufflebag
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: dufflebag-0.2.1
spec:
  serviceName: dufflebag-vault
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: dufflebag
      app.kubernetes.io/component: vault
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: dufflebag
        app.kubernetes.io/component: vault
    spec:
      serviceAccountName: dufflebag-vault
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-data-directory
          image: "docker.io/library/postgres:17-alpine"
          command: ["/bin/sh", "-ec", "chmod g+rwx /vault/file || true"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /vault/file
            - name: config
              mountPath: /vault/config
          resources:
            {}
      containers:
        - name: vault
          image: "docker.io/hashicorp/vault:2.0.3"
          args: ["server"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: VAULT_LOCAL_CONFIG
              value: '{"ui":true,"disable_mlock":true,"storage":{"file":{"path":"/vault/file"}},"listener":[{"tcp":{"address":"0.0.0.0:8200","tls_disable":true}}],"api_addr":"http://dufflebag-vault:8200"}'
          ports:
            - name: vault
              containerPort: 8200
          readinessProbe:
            # The listener is plain HTTP; without VAULT_ADDR the CLI probes
            # https and the pod never reports Ready. Sealed still exits
            # non-zero, so readiness continues to mean unsealed.
            exec:
              command:
                - /bin/sh
                - -ec
                - VAULT_ADDR=http://127.0.0.1:8200 vault status
            periodSeconds: 3
          livenessProbe:
            tcpSocket:
              port: vault
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /vault/file
            - name: config
              mountPath: /vault/config
          resources:
            {}
        - name: unsealer
          image: "docker.io/hashicorp/vault:2.0.3"
          command:
            - /bin/sh
            - -ec
            - |
              export VAULT_ADDR=http://127.0.0.1:8200
              while :; do
                unseal_key=$(cat /bootstrap/unseal-key 2>/dev/null || true)
                if [ -n "$unseal_key" ]; then
                  status=$(vault status -format=json 2>/dev/null || true)
                  if printf '%s' "$status" | grep -q '"sealed"[[:space:]]*:[[:space:]]*true'; then
                    vault operator unseal "$unseal_key" >/dev/null || true
                  fi
                fi
                sleep 5
              done
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: bootstrap-secret
              mountPath: /bootstrap
              readOnly: true
          resources:
            {}
      volumes:
        - name: bootstrap-secret
          secret:
            secretName: dufflebag-vault-bootstrap
            optional: true
        # The image's entrypoint writes VAULT_LOCAL_CONFIG under /vault/config,
        # which is image-owned: unwritable at OpenShift's arbitrary UID. An
        # emptyDir is group-writable via the SCC-assigned fsGroup.
        - name: config
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
# Source: dufflebag/templates/vault.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: dufflebag-vault-bootstrap
  labels:
    app.kubernetes.io/name: dufflebag
    app.kubernetes.io/instance: dufflebag
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: dufflebag-0.2.1
  annotations:
    # A Job's pod template is immutable, so upgrades would fail against the
    # completed install-time Job. As a hook it is replaced each install and
    # upgrade; every step it performs is idempotent by construction.
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: dufflebag
        app.kubernetes.io/component: vault-bootstrap
    spec:
      restartPolicy: OnFailure
      serviceAccountName: dufflebag-vault-bootstrap
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: "docker.io/hashicorp/vault:2.0.3"
          command:
            - /bin/sh
            - -ec
            - |
              export VAULT_ADDR=http://dufflebag-vault:8200
              until status=$(vault status -format=json 2>/dev/null || true) && [ -n "$status" ]; do sleep 2; done
              if printf '%s' "$status" | grep -q '"initialized"[[:space:]]*:[[:space:]]*false'; then
                vault operator init -key-shares=1 -key-threshold=1 -format=json > /work/init.json
                unseal_key=$(sed -n '/"unseal_keys_b64"/{n;s/.*"\([^"]*\)".*/\1/p;}' /work/init.json)
                root_token=$(sed -n 's/.*"root_token"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' /work/init.json)
                [ -n "$unseal_key" ] && [ -n "$root_token" ]
                printf '%s' "$unseal_key" > /work/unseal-key
                printf '%s' "$root_token" > /work/root-token
              else
                until [ -s /bootstrap/unseal-key ] && [ -s /bootstrap/root-token ]; do sleep 2; done
                unseal_key=$(cat /bootstrap/unseal-key)
                root_token=$(cat /bootstrap/root-token)
                [ -n "$unseal_key" ] && [ -n "$root_token" ]
              fi
              vault operator unseal "$unseal_key" >/dev/null 2>&1 || true
              export VAULT_TOKEN="$root_token"
              vault secrets list -format=json | grep -q '"transit/"' || vault secrets enable -path=transit transit
              vault write -f transit/keys/dufflebag >/dev/null
              vault auth list -format=json | grep -q '"kubernetes/"' || vault auth enable -path=kubernetes kubernetes
              vault write auth/kubernetes/config \
                kubernetes_host="https://$KUBERNETES_SERVICE_HOST:$KUBERNETES_SERVICE_PORT_HTTPS" \
                kubernetes_ca_cert=@/var/run/secrets/kubernetes.io/serviceaccount/ca.crt >/dev/null
              cat >/work/dufflebag-policy.hcl <<'POLICY'
              path "transit/encrypt/dufflebag" {
                capabilities = ["update"]
              }
              path "transit/decrypt/dufflebag" {
                capabilities = ["update"]
              }
              path "transit/rewrap/dufflebag" {
                capabilities = ["update"]
              }
              POLICY
              vault policy write dufflebag /work/dufflebag-policy.hcl
              vault write auth/kubernetes/role/dufflebag \
                bound_service_account_names=dufflebag \
                bound_service_account_namespaces=dufflebag \
                policies=dufflebag token_ttl=1h >/dev/null
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: bootstrap-secret
              mountPath: /bootstrap
              readOnly: true
            - name: work
              mountPath: /work
          resources:
            {}
        - name: escrow-bootstrap-credentials
          image: "quay.io/benjamin_holmes/ceph-aio:v20"
          imagePullPolicy: Always
          command:
            - /bin/sh
            - -ec
            - |
              python3 - <<'PY'
              import base64, json, os, ssl, time, urllib.error, urllib.request

              namespace = open('/var/run/secrets/kubernetes.io/serviceaccount/namespace').read()
              token = open('/var/run/secrets/kubernetes.io/serviceaccount/token').read()
              secret_name = 'dufflebag-vault-bootstrap'
              api = 'https://' + os.environ['KUBERNETES_SERVICE_HOST'] + ':' + os.environ['KUBERNETES_SERVICE_PORT_HTTPS']
              collection = api + '/api/v1/namespaces/' + namespace + '/secrets'
              headers = {'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json'}
              context = ssl.create_default_context(cafile='/var/run/secrets/kubernetes.io/serviceaccount/ca.crt')
              try:
                  urllib.request.urlopen(urllib.request.Request(collection + '/' + secret_name, headers=headers), context=context)
                  raise SystemExit(0)
              except urllib.error.HTTPError as error:
                  if error.code != 404:
                      raise
              while not all(os.path.exists('/work/' + key) and os.path.getsize('/work/' + key) for key in ('unseal-key', 'root-token')):
                  time.sleep(1)
              data = {}
              for key in ('unseal-key', 'root-token'):
                  data[key] = base64.b64encode(open('/work/' + key, 'rb').read()).decode()
              body = json.dumps({
                  'apiVersion': 'v1', 'kind': 'Secret',
                  'metadata': {'name': secret_name, 'namespace': namespace},
                  'type': 'Opaque', 'data': data,
              }).encode()
              urllib.request.urlopen(urllib.request.Request(collection, data=body, headers=headers), context=context)
              PY
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: work
              mountPath: /work
          resources:
            {}
      volumes:
        - name: bootstrap-secret
          secret:
            secretName: dufflebag-vault-bootstrap
            optional: true
        - name: work
          emptyDir: {}
