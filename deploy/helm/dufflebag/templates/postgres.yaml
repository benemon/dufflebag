apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dufflebag.fullname" . }}-postgres-init
  labels:
    {{- include "dufflebag.labels" . | nindent 4 }}
data:
  01-roles.sh: |
    #!/bin/sh
    set -eu
    psql -v ON_ERROR_STOP=1 --username postgres --dbname dufflebag \
      --set=migrate_password="$POSTGRES_MIGRATE_PASSWORD" \
      --set=app_password="$POSTGRES_APP_PASSWORD" <<'SQL'
    CREATE ROLE dufflebag_migrate LOGIN PASSWORD :'migrate_password';
    ALTER DATABASE dufflebag OWNER TO dufflebag_migrate;
    CREATE ROLE dufflebag_app LOGIN PASSWORD :'app_password' NOSUPERUSER NOBYPASSRLS;
    GRANT CONNECT ON DATABASE dufflebag TO dufflebag_app;
    GRANT USAGE ON SCHEMA public TO dufflebag_app;
    GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO dufflebag_app;
    ALTER DEFAULT PRIVILEGES FOR ROLE dufflebag_migrate IN SCHEMA public
      GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO dufflebag_app;
    SQL
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dufflebag.fullname" . }}-postgres
  labels:
    {{- include "dufflebag.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "dufflebag.fullname" . }}-postgres
  labels:
    {{- include "dufflebag.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "dufflebag.fullname" . }}-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: postgres
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-data-directory
          image: {{ printf "%s:%s" .Values.postgres.image.repository .Values.postgres.image.tag | quote }}
          command: ["/bin/sh", "-ec", "chmod g+rwx /var/lib/postgresql/data || true"]
          securityContext:
            {{- include "dufflebag.postgresSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
      containers:
        - name: postgres
          image: {{ printf "%s:%s" .Values.postgres.image.repository .Values.postgres.image.tag | quote }}
          command:
            - /bin/sh
            - -ec
            - |
              if [ "$(id -u)" = 0 ]; then
                exec gosu postgres:root docker-entrypoint.sh postgres
              fi
              exec docker-entrypoint.sh postgres
          securityContext:
            {{- include "dufflebag.postgresSecurityContext" . | nindent 12 }}
          env:
            - name: POSTGRES_DB
              value: dufflebag
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "dufflebag.fullname" . }}-postgres
                  key: postgres-password
            - name: POSTGRES_MIGRATE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "dufflebag.fullname" . }}-postgres
                  key: migrate-password
            - name: POSTGRES_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "dufflebag.fullname" . }}-postgres
                  key: app-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "dufflebag"]
            periodSeconds: 2
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
      volumes:
        - name: initdb
          configMap:
            name: {{ include "dufflebag.fullname" . }}-postgres-init
            defaultMode: 0555
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.postgres.persistence.size }}
