name: release

# A tag is the release act: v* publishes an image. Tags containing -rc push
# through the expiring RC target; plain v* tags push a permanent image
# (conventions rule 6 — the split lives in the Makefile, CI only picks a
# target, so a green pipeline is reproducible locally).
on:
  push:
    tags: ['v*']

jobs:
  # A tag names a commit; this proves that commit survived the full main
  # validation before anything permanent is published. It queries rather than
  # re-runs — the suite already ran where the commit landed — so a tag on an
  # unvalidated, still-running, or failed commit stops here. The same
  # character check as the publish steps runs before the tag name is used in
  # an API path, and the commits API peels annotated tags to their commit.
  validate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require a green ci run for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          case "$RELEASE_TAG" in (*[!A-Za-z0-9._-]*) echo "refusing tag: $RELEASE_TAG"; exit 1;; esac
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)
          conclusion=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha&event=push&status=completed" \
            --jq '.workflow_runs[0].conclusion // "absent"')
          if [ "$conclusion" != "success" ]; then
            echo "ci for $sha concluded: $conclusion (need: success)." >&2
            echo "Tag a commit whose push to main finished green — 'absent' means no completed run exists yet (not on main, or still running)." >&2
            exit 1
          fi
          echo "ci for $sha concluded success"

  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write      # release creation and SBOM upload on plain tags
      id-token: write      # provenance attestation signing
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # cyclonedx-gomod derives the release version from the tag history;
          # a depth-1 checkout can leave it nothing to describe against.
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Write the SBOM
        run: make sbom
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to Quay
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}
      # The tag reaches the shell through the environment, never by
      # interpolation into script source: git accepts tag names that would
      # escape any quoting. The character check also guarantees it is a valid
      # image tag.
      - name: Push release-candidate image (expiring)
        if: contains(github.ref_name, '-rc')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          case "$RELEASE_TAG" in (*[!A-Za-z0-9._-]*) echo "refusing tag: $RELEASE_TAG"; exit 1;; esac
          make image-push-rc IMAGE_TAG="$RELEASE_TAG"
      - name: Push release image
        if: ${{ !contains(github.ref_name, '-rc') }}
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          case "$RELEASE_TAG" in (*[!A-Za-z0-9._-]*) echo "refusing tag: $RELEASE_TAG"; exit 1;; esac
          make image-push-release IMAGE_TAG="$RELEASE_TAG"
      # An RC expires, so its SBOM rides the workflow run rather than a
      # permanent release.
      - name: Attach the SBOM to the run (release candidate)
        if: contains(github.ref_name, '-rc')
        uses: actions/upload-artifact@v7
        with:
          name: dufflebag-sbom
          path: dufflebag.cdx.json
          if-no-files-found: error
      # A plain tag is the release act, so the SBOM lands on a GitHub release
      # for the tag — created here when the tag does not have one yet.
      - name: Attach the SBOM to the release
        if: ${{ !contains(github.ref_name, '-rc') }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          case "$RELEASE_TAG" in (*[!A-Za-z0-9._-]*) echo "refusing tag: $RELEASE_TAG"; exit 1;; esac
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --generate-notes
          gh release upload "$RELEASE_TAG" dufflebag.cdx.json --clobber
      # The image name matches the Makefile IMAGE default; the digest is what
      # the attestation binds to, so it is read back from the registry rather
      # than assumed.
      - name: Resolve the pushed image digest
        if: ${{ !contains(github.ref_name, '-rc') }}
        id: digest
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          case "$RELEASE_TAG" in (*[!A-Za-z0-9._-]*) echo "refusing tag: $RELEASE_TAG"; exit 1;; esac
          digest=$(docker buildx imagetools inspect \
            "quay.io/benjamin_holmes/dufflebag:$RELEASE_TAG" \
            --format '{{json .Manifest}}' | jq -r '.digest')
          [ -n "$digest" ] && [ "$digest" != "null" ]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      # Signed build provenance for the permanent image, stored in the
      # repository's attestation store. Verify with:
      #   gh attestation verify oci://quay.io/benjamin_holmes/dufflebag:<tag> -R benemon/dufflebag
      - name: Attest the release image provenance
        if: ${{ !contains(github.ref_name, '-rc') }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: quay.io/benjamin_holmes/dufflebag
          subject-digest: ${{ steps.digest.outputs.digest }}
