name: scanoss

# Provenance guard: fingerprints committed code against the public OSSKB
# corpus and comments on the pull request when a file or snippet matches
# known open-source code. Only winnowing fingerprints leave the runner,
# never source.
#
# Informational by design — no policies are enabled. The generated trees
# (skipped via scanoss.json, alongside the vendored specs whose provenance
# spec/vendor/PROVENANCE.md documents) match hashicorp/hcp-sdk-go by
# construction: the same public swagger specs run through the same
# generator. A copyleft policy would therefore fail every pull request
# touching them. A match is only meaningful in hand-written code, where a
# human reads the comment and decides.

on:
  pull_request:
  # Full-tree sweep runs weekly, not on every push: a full scan fires a burst
  # of fingerprint requests that trips the free OSSKB per-IP rate limit, and
  # scanning on every push kept the endpoint in an extending multi-day
  # cooldown. Pull requests scan only changed files (delta) and stay under it.
  schedule:
    - cron: '37 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      # continue-on-error: the free OSSKB endpoint rate-limits (503) and would
      # otherwise flake this job. No policies are enabled here, so provenance
      # matches arrive as PR comments regardless — only the infrastructure
      # failure is tolerated, never a real finding.
      - name: Scan for open-source matches
        continue-on-error: true
        uses: scanoss/gha-code-scan@d3c8f659544885761c8e3b96743ea14b830474aa # v1
        with:
          # Pull requests scan only their changed files (delta); the weekly
          # scheduled sweep and manual dispatch scan the full tree.
          scanMode: ${{ github.event_name == 'pull_request' && 'delta' || 'full' }}
