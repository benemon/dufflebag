name: live HCP conformance

# Manual-only by design: Ben can add a schedule later for runs against the paid account.
# With no pull_request trigger, repository secrets are never exposed to fork pull requests.
on:
  workflow_dispatch:

concurrency: { group: live-hcp, cancel-in-progress: false }

jobs:
  live-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The secrets context is not valid in a job-level if, so the gate is the
    # first step: a manual dispatch without the repository secret fails fast
    # with the reason rather than pretending to run.
    env:
      HCP_CLIENT_ID: ${{ secrets.HCP_CLIENT_ID }}
      HCP_CLIENT_SECRET: ${{ secrets.HCP_CLIENT_SECRET }}
    steps:
      - name: Refuse without the repository secret
        if: ${{ env.HCP_CLIENT_ID == '' }}
        run: |
          echo "HCP_CLIENT_ID/HCP_CLIENT_SECRET repository secrets are not configured" >&2
          exit 1
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            contract/go.sum
      - name: Run live HCP conformance suite
        run: make test-live-conformance
