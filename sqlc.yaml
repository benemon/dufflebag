version: "2"
sql:
  - engine: postgresql
    schema:
      - internal/store/postgres/migrations/000001_baseline.up.sql
    queries: internal/store/postgres/query.sql
    gen:
      go:
        package: postgresdb
        out: internal/store/postgres/postgresdb
        sql_package: database/sql
        emit_json_tags: true
        overrides:
          - column: bagdrop_configs.last_verification
            go_type:
              type: byte
              slice: true
          - column: webhooks.sealed_secret
            go_type:
              type: byte
              slice: true
