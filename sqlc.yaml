version: "2"
sql:
  - engine: postgresql
    schema:
      - internal/store/postgres/migrations/000001_baseline.up.sql
      - internal/store/postgres/migrations/000006_plugin_registries.up.sql
      - internal/store/postgres/migrations/000007_plugin_versions.up.sql
      - internal/store/postgres/migrations/000008_plugin_imports.up.sql
      - internal/store/postgres/migrations/000009_plugin_import_changes.up.sql
      - internal/store/postgres/migrations/000010_plugin_update_checks.up.sql
      - internal/store/postgres/migrations/000011_organization_webhooks.up.sql
      - internal/store/postgres/migrations/000012_plugin_import_origin.up.sql
    queries: internal/store/postgres/query.sql
    gen:
      go:
        package: postgresdb
        out: internal/store/postgres/postgresdb
        sql_package: database/sql
        emit_json_tags: true
        overrides:
          - column: bagdrop_configs.last_verification
            go_type:
              type: byte
              slice: true
          - column: webhooks.sealed_secret
            go_type:
              type: byte
              slice: true
          - column: organization_webhooks.sealed_secret
            go_type:
              type: byte
              slice: true
